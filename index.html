    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module">
      const loadApp = async () => {
        const metaEnv = import.meta.env ?? {};
        const loaders = metaEnv.PROD
          ? [() => import("./src/main.tsx")]
          : [() => import("/src/main.tsx")];

        loaders.push(
          () =>
            new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.type = "module";
              script.src = "/assets/index.js";
              script.onload = () => resolve(void 0);
              script.onerror = () => reject(new Error("Kunne ikke laste fallback-modulen"));
              document.head.appendChild(script);
            }),
        );

        let lastError = null;

        for (const load of loaders) {
          try {
            await load();
            return;
          } catch (error) {
            lastError = error;
            console.warn("Kunne ikke laste modul", error);
          }
        }

        console.error("Kunne ikke laste applikasjonen", lastError);
      };

      loadApp();
    </script>
  </body>
</html>
